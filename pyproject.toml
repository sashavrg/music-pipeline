[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "music-pipeline"
version = "0.1.0"
description = "Automated slskd → beets → Plex music import pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sasha" }]

# Runtime deps. The host install.sh deploys via wrapper scripts and does NOT
# run `pip install` — host uses system beets / system mutagen / etc. So these
# deps are only resolved when `pip install .` runs inside the container.
#
# `beets` is listed here for the container build; the chroma/fetchart/discogs/
# lastgenre/lyrics plugins each pull in one or more of the extras below.
dependencies = [
    "beets",
    "mutagen",
    "pyacoustid",
    "pyyaml",
    "requests",
    "beautifulsoup4",
    "python3-discogs-client",
    "pillow",
    "pylast",
]

[project.scripts]
slskd-incomplete-watchdog    = "pipeline.incomplete_watchdog:main"
slskd-fill-missing-tracks    = "pipeline.fill_missing_tracks:main"
slskd-quarantine-requeue     = "pipeline.quarantine_requeue:main"
slskd-wishlist-check         = "pipeline.wishlist_check:main"
pipeline-fulfill-wishlist    = "pipeline.wishlist_fulfillment:main"
slskd-recover                = "pipeline.recover:main"
slskd-telegram-bot           = "pipeline.telegram_bot:main"
pipeline-weekly-digest       = "pipeline.weekly_digest:main"
beets-quality-upgrade        = "pipeline.beets_quality_upgrade:main"
check-chromaprint            = "pipeline.check_chromaprint:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]
